# Deploy as a Render Blueprint (New > Blueprint) with Neon PostgreSQL.
services:
  - type: web
    name: cineva-cinema-booking
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false  # Paste the Neon connection string privately in Render.
